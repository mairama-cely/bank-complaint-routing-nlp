selected_exports: [15, 16, 17, 18, 19, 20, 21]

paths:
  raw: data/raw
  interim: data/interim
  reports: reports
  tables: reports/tables
  figures: reports/figures
  docs: docs

probe:
  timeout_s: 30
  max_retries: 3

min_narratives_per_class: 2000

# Time-window rule (Phase 1, decided 2026-10-05): months whose narrative volume is below this ratio of the
# median monthly volume are excluded from the taxonomy-stability comparison and from the window counts.
window_min_volume_ratio: 0.10

# Phase 1 decisions validated by the user on 2026-10-05 (consumed by Phase 2).
analysis_window:
  start: "2026-01"
  end: "2026-07"
dedup_rule:
  conflicting_texts: drop_all   # identical narrative with >1 distinct label at conflict_level: drop every row
  conflict_level: service       # changed from product on 2026-10-05 (2a audit: 20 texts / 106 rows at service level vs 22 / 111 at product level)
  other_duplicates: keep_one    # identical narrative, single label at conflict_level: keep one row
  keep_one_order: [date_received, complaint_id]   # deterministic choice: earliest date received, then lowest id

# Phase 2 decisions (user, 2026-10-05). Final regexes are fixed in 2b from the 2a audit.
phase2:
  mask_strategy: replace_with_tokens
  mask_tokens: {date: "[DATE]", generic: "[REDACTED]"}   # not "[MASK]": reserved special token in BERT/DistilBERT
  short_text_policy: keep_all                            # measured in 2a, never deleted for length alone
  amount_token: "[AMOUNT]"                               # {$...} amounts and {>= $9,999,999} caps (2a: A3)
  collapse_consecutive_tokens: true                      # e.g. "XXXX XXXX XXXX" -> one [REDACTED]
  unmasked_dates_to_token: true                          # 64 fully numeric dates also become [DATE] (2a: A1)
  drop_only_masks: true                                  # 6 narratives with no word outside masks (2a: A5); not a length rule
  split: {train: 0.70, val: 0.15, test: 0.15, stratify_by: service, seed: 42}
  dedup_on: cleaned_text                                 # decided 2026-10-05: near-duplicates differing only by masked values
  language_check:                                        # measurement only (no filtering), heuristic on stopword ratios
    min_words: 10
    max_english_stopword_ratio: 0.15                     # below this ratio -> flagged "non_english_suspect"

# Phase 3 decisions (user, 2026-10-05).
phase3:
  variants: [as_is, company_masked]          # compare raw company names vs [COMPANY] masking
  models: [logreg, linear_svc]               # tuned on val (macro-F1); test used once; LinearSVC calibrated if selected
  company_mask:
    token: "[COMPANY]"
    lexicon_source: train                    # built from the train split only, applied unchanged to val/test
    min_company_complaints: 20               # companies with >= 20 train complaints
    single_token_min_len: 4
    single_token_min_docs: 20
    single_token_min_concentration: 0.50     # share of train docs containing the token whose Company contains it
    single_token_max_companies: 3            # decided 2026-10-05: reject words shared by > 3 company names (union, national...)
    manual_aliases: none                     # decided 2026-10-05: no hand-written brand list (citi, cash app... stay visible)
    legal_suffixes: [inc, llc, corp, corporation, co, company, na, ltd, lp, plc, holdings, holding, group, the, dba]
  tfidf:                                     # fitted on train only
    ngram_range: [1, 2]
    min_df: 5
    max_df: 0.9
    max_features: 300000
    sublinear_tf: true
    token_pattern: '(?u)\[\w+\]|\b\w\w+\b'   # keeps [date], [amount], [redacted], [company] as tokens
  grid:                                      # selection on val by macro-F1
    logreg_C: [1.0, 4.0, 16.0]
    linear_svc_C: [0.1, 0.3, 1.0]
    class_weight: [null, balanced]
  random_state: 42
  evaluation:                               # Phase 3c-ii (test used once; lock in reports/phase3c/TEST_LOCK.json)
    reference_variant: company_masked        # decided 2026-10-05
    bootstrap_resamples: 1000
    calibration_bins: 15
    high_confidence: 0.90                    # errors above this confidence = label-noise candidates
    examples_per_pair: 3
  external_test:                             # decided 2026-10-05 (option B): temporal robustness, never used for training
    label: "2025"
    exports: [9, 10, 11, 12, 13, 14]         # complaints received January - December 2025
    unknown_products: exclude_and_report     # product labels absent from the frozen mapping

# Phase 5 — routing threshold (protocol fixed before any computation, 2026-10-05)
phase5:
  reference_variant: company_masked
  decision_rules: [calibrated_argmax, raw_svc_argmax]   # A = model evaluated in 3c ; B = raw LinearSVC class + calibrated confidence
  selection: max_val_coverage_at_target_precision       # tie -> calibrated_argmax
  target_precision: 0.95
  sensitivity_precisions: [0.90, 0.97]
  threshold_grid: {start: 0.30, stop: 0.995, step: 0.005}
  volume_per_month: 1000                                # illustrative volume, not an Afriland figure
  triage_minutes: [1, 2, 3, 5]                          # assumption (cadrage §4), not a measurement
  bootstrap_resamples: 1000

# CSV reading (decided 2026-10-05 after 5 mis-split rows in exports 9 and 13, next to multi-line quoted narratives;
# suspected cause: DuckDB's default parallel/auto-detected reading, NOT reproduced on synthetic data). Sequential,
# explicit dialect. Used by verify_csv_parsing.py and build_external.py.
csv_strict_options: "header=true, all_varchar=true, parallel=false, quote='\"', escape='\"', max_line_size=20000000"

# Target services (cadrage §3). Product -> service mapping is produced as a DRAFT in config/label_mapping.yaml.
target_services:
  - "Comptes & Dépôts"
  - "Monétique"
  - "Transferts & Paiements"
  - "Crédits aux particuliers"
  - "Crédit immobilier"
  - "Recouvrement"
